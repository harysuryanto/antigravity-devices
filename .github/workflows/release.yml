name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Syntax check scripts
        run: |
          sh -n bin/launch-server.sh
          node --check scripts/server.mjs
          node --check scripts/devices.mjs
          node --check scripts/ios-preview.mjs
          node --check scripts/android-preview.mjs
          node --check build/package.mjs
          node --check build/release.mjs

      - name: Build and package release archives
        run: bun run package:release

      - name: Verify tag matches plugin.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e '
            const fs = require("node:fs");
            const plugin = JSON.parse(fs.readFileSync("plugin.json", "utf8"));
            const tag = process.env.GITHUB_REF_NAME;
            if (tag !== `v${plugin.version}`) {
              throw new Error(`Tag ${tag} does not match plugin.json version v${plugin.version}`);
            }
            console.log("Verified tag matches version:", tag);
          '

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
